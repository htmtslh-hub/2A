      .navigation.is-open{display:block}
      .navigation__link:nth-child(n){position:static;justify-content:flex-start;padding:0 calc(14 * var(--u));height:48px;font-size:17px}
      .partner{position:static;height:46px;padding:0 5px 0 18px;margin:calc(12 * var(--u)) 0 0;font-size:15px;gap:18px;width:max-content}.partner .disc{width:36px;height:36px}
      .hero-copy{left:var(--gutter);right:var(--gutter);bottom:max(calc(100 * var(--u)),calc(env(safe-area-inset-bottom) + 85px))}
      .brand{font-size:calc(27 * var(--u));margin-bottom:calc(22 * var(--u))}
      .title{font-size:min(clamp(32px,10.4vw,60px),calc((100vw - 2 * var(--gutter)) / 8.7))}

      .actions{margin-top:calc(23 * var(--u))}.cta{gap:calc(16 * var(--u))}.cue{bottom:max(calc(22 * var(--u)),env(safe-area-inset-bottom));right:var(--gutter)}
    }
    @media(max-height:500px) and (min-aspect-ratio:1/1){

      .brand{margin-bottom:calc(12 * var(--u));font-size:calc(23 * var(--u))}.title{font-size:clamp(28px,10dvh,44px)}
      .lede{margin-top:calc(12 * var(--u));font-size:calc(12 * var(--u));line-height:1.4}.actions{flex-wrap:nowrap;margin-top:calc(14 * var(--u))}

    }
    @media(max-width:649.98px) and (max-height:500px) and (min-aspect-ratio:1/1){.navigation.is-open{display:grid;grid-template-columns:1fr 1fr}.partner{margin-top:0}.hero-copy{right:auto}.cue{font-size:calc(10 * var(--u));gap:calc(6 * var(--u))}}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>

  <script>
    (()=>{
      'use strict';
      const root=document.documentElement,header=document.querySelector('.header');
      const button=document.querySelector('.menu-button'),nav=document.querySelector('.navigation');
      const small=matchMedia('(max-width:649.98px)'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
      function setMenu(open,focus=false){
        nav.classList.toggle('is-open',open);button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Close navigation':'Open navigation');
        if(small.matches)nav.inert=!open;else nav.inert=false;
        if(open&&focus)nav.querySelector('a').focus();
      }
      setMenu(false);
      button.addEventListener('click',()=>setMenu(!nav.classList.contains('is-open'),true));
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&nav.classList.contains('is-open')){setMenu(false);button.focus();}});
      document.addEventListener('click',event=>{if(!nav.contains(event.target)&&!button.contains(event.target))setMenu(false);});
      nav.addEventListener('click',event=>{if(event.target.closest('a'))setMenu(false);});
      small.addEventListener('change',()=>setMenu(false));
      const sound=document.querySelector('.sound');
      sound.addEventListener('click',()=>sound.setAttribute('aria-pressed',String(sound.getAttribute('aria-pressed')!=='true')));
      const video=document.querySelector('.river');
      const play=()=>{video.muted=true;video.play().catch(()=>{});};
      document.addEventListener('pointerdown',play,{once:true});
      document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause();else play();});
      play();

      let done=false;const animations=[];
      const finish=()=>{root.classList.remove('is-waiting','is-entering');};
      async function entrance(){
        if(done)return;done=true;
        if(reduced.matches||!Element.prototype.animate){finish();return;}
        const cta=document.querySelector('.cta');
        const travel=value=>Math.round(value*cta.getBoundingClientRect().height/46*(small.matches?.8:1));
        const expo='cubic-bezier(.16,1,.3,1)',quart='cubic-bezier(.25,1,.5,1)';
        function animate(element,frames,duration,delay,easing=expo){
          if(!element)return;
          const animation=element.animate(frames,{duration,delay,easing,fill:'backwards'});animations.push(animation);
        }
        function rise(element,distance,duration,delay,easing=expo){animate(element,[{opacity:0,transform:`translateY(${travel(distance)}px)`},{opacity:1,transform:'none'}],duration,delay,easing);}
        root.classList.add('is-entering');
        animate(document.querySelector('.logo'),[{opacity:0},{opacity:1}],500,0,quart);
        document.querySelectorAll('.tree path').forEach((path,index)=>{
          const length=path.getTotalLength();
          animate(path,[{strokeDasharray:`${length}`,strokeDashoffset:length},{strokeDasharray:`${length}`,strokeDashoffset:0}],820,80+45*index,'cubic-bezier(.45,0,.2,1)');
        });
        animate(document.querySelector('.moth'),[{opacity:0,transform:'scale(.92)'},{opacity:1,transform:'scale(1)'}],650,420);
        rise(small.matches?button:nav,8,700,120);
        if(!small.matches)nav.querySelectorAll('a').forEach((link,index)=>rise(link,4,700,260+45*index));
        rise(sound,8,700,200);rise(document.querySelector('.brand'),10,650,300);
        document.querySelectorAll('.title__line').forEach((line,index)=>animate(line,[{transform:'translateY(115%)'},{transform:'translateY(0)'}],1050,380+90*index));
        document.querySelectorAll('.lede span').forEach((line,index)=>rise(line,14,800,800+60*index));
        rise(cta,12,800,1000);rise(document.querySelector('.text-link'),8,600,1100,quart);rise(document.querySelector('.cue'),-6,700,1250);
        root.classList.remove('is-waiting');
        await Promise.allSettled(animations.map(animation=>animation.finished));
        animations.forEach(animation=>animation.cancel());
        const redraw=[document.querySelector('.logo'),document.querySelector('.actions')];
        redraw.forEach(element=>{element.classList.add('redraw');element.getBoundingClientRect();});
        await new Promise(resolve=>requestAnimationFrame(resolve));
        redraw.forEach(element=>element.classList.remove('redraw'));
        finish();
      }
      const loaded=video.readyState>=2?Promise.resolve():new Promise(resolve=>{video.addEventListener('loadeddata',resolve,{once:true});video.addEventListener('error',resolve,{once:true});});
      if(reduced.matches){done=true;finish();}
      else Promise.race([Promise.all([document.fonts.ready,loaded]),new Promise(resolve=>setTimeout(resolve,3500))]).then(()=>requestAnimationFrame(entrance));
      reduced.addEventListener('change',()=>{if(reduced.matches){done=true;animations.forEach(animation=>animation.cancel());finish();}});
    })();
  </script>
