<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Ambient emerald-mint aura -->
    <radialGradient id="fg-aura" cx="50%" cy="54%" r="46%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Left Box Face: Sunlit Emerald Crystal -->
    <linearGradient id="fg-box-left" x1="16" y1="42" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="28%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Left Box Crystal Facet Highlight -->
    <linearGradient id="fg-facet-light" x1="16" y1="42" x2="36" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Right Box Face: Deep Shaded Emerald Crystal -->
    <linearGradient id="fg-box-right" x1="50" y1="42" x2="84" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="32%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Lid Top Diamond Plane: Bright Icy Mint-Emerald -->
    <linearGradient id="fg-lid-top" x1="18" y1="18" x2="82" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="28%" stop-color="#a7f3d0" />
      <stop offset="68%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Lid Left Rim -->
    <linearGradient id="fg-lid-left" x1="12" y1="31" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Lid Right Rim -->
    <linearGradient id="fg-lid-right" x1="50" y1="31" x2="88" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Ribbon & Bow: Gleaming Champagne-Gold & Silver-Pearl Chrome -->
    <linearGradient id="fg-rib-sun" x1="25" y1="15" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#fef9c3" />
      <stop offset="58%" stop-color="#fde047" />
      <stop offset="88%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="fg-rib-shade" x1="50" y1="18" x2="78" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="78%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="fg-bow-left" x1="16" y1="8" x2="50" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef9c3" />
      <stop offset="65%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="fg-bow-right" x1="50" y1="8" x2="84" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#fef08a" />
      <stop offset="62%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <linearGradient id="fg-bow-inner" x1="24" y1="14" x2="76" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>
  </defs>

  <!-- Soft outer emerald aura -->
  <circle cx="50" cy="54" r="44" fill="url(#fg-aura)" />

  <!-- ==================== 3D CRYSTAL BOX BODY ==================== -->
  <!-- Left Face -->
  <path
    d="M16 40.5 L50 54.5 L50 93 L16 77.5 Z"
    fill="url(#fg-box-left)"
    stroke="#a7f3d0"
    stroke-width="0.85"
    stroke-linejoin="round"
  />
  <!-- Left Crystal Facet Sheen -->
  <path d="M16 40.5 L28.2 45.5 L28.2 83.1 L16 77.5 Z" fill="url(#fg-facet-light)" />
  <path d="M16 40.5 L50 54.5 L37.8 68 L16 56 Z" fill="#ffffff" opacity="0.12" />

  <!-- Right Face -->
  <path
    d="M50 54.5 L84 40.5 L84 77.5 L50 93 Z"
    fill="url(#fg-box-right)"
    stroke="#34d399"
    stroke-width="0.85"
    stroke-linejoin="round"
  />
  <!-- Right Crystal Facet Depth -->
  <path d="M71.8 45.5 L84 40.5 L84 77.5 L71.8 83.1 Z" fill="#022c22" opacity="0.26" />
  <path d="M50 54.5 L84 40.5 L84 55 L50 70 Z" fill="#a7f3d0" opacity="0.08" />

  <!-- Vertical Ribbon on Left Box Face (x = 28.2 to 38.2) -->
  <path
    d="M28.2 45.5 L38.2 49.6 L38.2 87.6 L28.2 83.1 Z"
    fill="url(#fg-rib-sun)"
    stroke="#ca8a04"
    stroke-width="0.6"
    stroke-linejoin="round"
  />
  <path d="M29.4 46.2 L29.4 83.4" stroke="#ffffff" stroke-width="0.75" opacity="0.8" />

  <!-- Vertical Ribbon on Right Box Face (x = 61.8 to 71.8) -->
  <path
    d="M61.8 49.6 L71.8 45.5 L71.8 83.1 L61.8 87.6 Z"
    fill="url(#fg-rib-shade)"
    stroke="#854d0e"
    stroke-width="0.6"
    stroke-linejoin="round"
  />
  <path d="M63 49.4 L63 86.8" stroke="#fef9c3" stroke-width="0.65" opacity="0.65" />

  <!-- Crisp Drop Shadow directly under the overhanging lid -->
  <path
    d="M16 40.2 L50 54.2 L84 40.2 L84 45.2 L50 59.5 L16 45.2 Z"
    fill="#022c22"
    opacity="0.52"
  />

  <!-- ==================== 3D GIFT LID ==================== -->
  <!-- Lid Top Diamond Plane -->
  <path
    d="M50 17.5 L88 31.5 L50 46 L12 31.5 Z"
    fill="url(#fg-lid-top)"
    stroke="#ecfdf5"
    stroke-width="0.85"
    stroke-linejoin="round"
  />
  <!-- Lid Top Crystal Facets -->
  <path d="M50 17.5 L69 24.5 L50 31.7 L31 24.5 Z" fill="#ffffff" opacity="0.28" />

  <!-- Lid Front-Left Rim -->
  <path
    d="M12 31.5 L50 46 L50 54.8 L12 40 Z"
    fill="url(#fg-lid-left)"
    stroke="#a7f3d0"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Lid Front-Right Rim -->
  <path
    d="M50 46 L88 31.5 L88 40 L50 54.8 Z"
    fill="url(#fg-lid-right)"
    stroke="#34d399"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Cross-Ribbon Strip 1 on Lid Top (Front-Left to Back-Right, x=27.5..38.0) -->
  <path
    d="M27.5 37.4 L65.5 23.2 L75.5 26.9 L38 41.4 Z"
    fill="url(#fg-rib-sun)"
    stroke="#ca8a04"
    stroke-width="0.55"
    stroke-linejoin="round"
  />

  <!-- Cross-Ribbon Strip 2 on Lid Top (Back-Left to Front-Right, x=62.0..72.5) -->
  <path
    d="M34.5 23.2 L72.5 37.4 L62 41.4 L24.5 26.9 Z"
    fill="url(#fg-rib-sun)"
    stroke="#ca8a04"
    stroke-width="0.55"
    stroke-linejoin="round"
  />

  <!-- Ribbon Strip down Lid Front-Left Rim (x = 27.5 to 38.0) -->
  <path
    d="M27.5 37.4 L38 41.4 L38 50.1 L27.5 46 Z"
    fill="url(#fg-rib-sun)"
    stroke="#ca8a04"
    stroke-width="0.6"
    stroke-linejoin="round"
  />

  <!-- Ribbon Strip down Lid Front-Right Rim (x = 62.0 to 72.5) -->
  <path
    d="M62 41.4 L72.5 37.4 L72.5 46 L62 50.1 Z"
    fill="url(#fg-rib-shade)"
    stroke="#854d0e"
    stroke-width="0.6"
    stroke-linejoin="round"
  />

  <!-- Specular Rim Highlights on Lid & Box Center Edge -->
  <path
    d="M13 31.8 L50 46 L87 31.8"
    stroke="#ffffff"
    stroke-width="1.25"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
  <path
    d="M50 46 L50 92"
    stroke="#ecfdf5"
    stroke-width="1.05"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- ==================== SCULPTED 3D ROYAL BOW ==================== -->
  <!-- Left Flowing Ribbon Tail -->
  <path
    d="M47.5 28.5 L32 39.5 L38 39.8 L40.5 44.8 L50 32.2 Z"
    fill="url(#fg-rib-sun)"
    stroke="#a16207"
    stroke-width="0.65"
    stroke-linejoin="round"
  />
  <!-- Right Flowing Ribbon Tail -->
  <path
    d="M52.5 28.5 L68 39.5 L62 39.8 L59.5 44.8 L50 32.2 Z"
    fill="url(#fg-rib-shade)"
    stroke="#854d0e"
    stroke-width="0.65"
    stroke-linejoin="round"
  />

  <!-- Left Sculpted Bow Loop -->
  <path
    d="M49 28.5 C39.5 30 19 26.5 17.5 17 C16 8.2 30.5 5.5 41.5 13.5 C46 16.8 48.5 22.5 49.5 28 Z"
    fill="url(#fg-bow-left)"
    stroke="#a16207"
    stroke-width="0.75"
    stroke-linejoin="round"
  />
  <!-- Left Bow Inner Shadow Fold -->
  <path
    d="M44.2 24.8 C37.2 25.2 25.5 22.5 24.5 17.2 C23.8 13 31.8 11.8 38.8 16.8 C41.8 19 43.5 22 44.2 24.8 Z"
    fill="url(#fg-bow-inner)"
    opacity="0.88"
  />

  <!-- Right Sculpted Bow Loop -->
  <path
    d="M51 28.5 C60.5 30 81 26.5 82.5 17 C84 8.2 69.5 5.5 58.5 13.5 C54 16.8 51.5 22.5 50.5 28 Z"
    fill="url(#fg-bow-right)"
    stroke="#854d0e"
    stroke-width="0.75"
    stroke-linejoin="round"
  />
  <!-- Right Bow Inner Shadow Fold -->
  <path
    d="M55.8 24.8 C62.8 25.2 74.5 22.5 75.5 17.2 C76.2 13 68.2 11.8 61.2 16.8 C58.2 19 56.5 22 55.8 24.8 Z"
    fill="url(#fg-bow-inner)"
    opacity="0.88"
  />

  <!-- Bow Specular Chrome Highlights -->
  <path
    d="M21 14.2 C25.5 9.2 34.5 10 42.5 16.2"
    stroke="#ffffff"
    stroke-width="1.35"
    stroke-linecap="round"
    opacity="0.95"
  />
  <path
    d="M79 14.2 C74.5 9.2 65.5 10 57.5 16.2"
    stroke="#ffffff"
    stroke-width="1.25"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Center Gem-Knot of the Bow -->
  <rect
    x="44.2"
    y="21.8"
    width="11.6"
    height="10.8"
    rx="4"
    fill="url(#fg-rib-sun)"
    stroke="#92400e"
    stroke-width="0.8"
  />
  <path
    d="M46.5 23.6 H53.5"
    stroke="#ffffff"
    stroke-width="1.3"
    stroke-linecap="round"
    opacity="0.96"
  />

  <!-- ==================== SPARKLES ==================== -->
  <path
    d="M10.5 17.5 L12.2 12.8 L16.8 11 L12.2 9.2 L10.5 4.5 L8.8 9.2 L4.2 11 L8.8 12.8 Z"
    fill="#ffffff"
  />
  <path
    d="M89.5 16.5 L90.9 12.8 L94.5 11.5 L90.9 10.2 L89.5 6.5 L88.1 10.2 L84.5 11.5 L88.1 12.8 Z"
    fill="#a7f3d0"
  />
  <path
    d="M50 2 L51.2 5.5 L54.8 6.7 L51.2 7.9 L50 11.5 L48.8 7.9 L45.2 6.7 L48.8 5.5 Z"
    fill="#fef08a"
  />
</svg>
