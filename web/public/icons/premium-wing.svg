<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Soft cyan-blue inner aura behind the feather core -->
    <radialGradient id="pw-aura" cx="65%" cy="46%" r="30%">
      <stop offset="0%" stop-color="#a6fcff" stop-opacity="0.95" />
      <stop offset="42%" stop-color="#52c5ff" stop-opacity="0.7" />
      <stop offset="76%" stop-color="#487df2" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#487df2" stop-opacity="0" />
    </radialGradient>

    <!-- Outer long icy-white to sky-blue feather fill -->
    <linearGradient id="pw-ice-outer" x1="6" y1="8" x2="72" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2e9ff" />
      <stop offset="18%" stop-color="#eef9ff" />
      <stop offset="56%" stop-color="#cdeeff" />
      <stop offset="82%" stop-color="#7ec0ff" />
      <stop offset="100%" stop-color="#497ff0" />
    </linearGradient>

    <!-- Upper-mid ice feather gradient -->
    <linearGradient id="pw-ice-mid" x1="16" y1="22" x2="74" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bce8ff" />
      <stop offset="22%" stop-color="#e8f8ff" />
      <stop offset="60%" stop-color="#b0e1ff" />
      <stop offset="85%" stop-color="#62b2ff" />
      <stop offset="100%" stop-color="#4276e6" />
    </linearGradient>

    <!-- Lower & tail feather gradient (ice tip to royal periwinkle root) -->
    <linearGradient id="pw-ice-tail" x1="52" y1="90" x2="84" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae4ff" />
      <stop offset="24%" stop-color="#e5f5ff" />
      <stop offset="60%" stop-color="#9bc6ff" />
      <stop offset="84%" stop-color="#5e8bf2" />
      <stop offset="100%" stop-color="#3c61d6" />
    </linearGradient>

    <!-- Luminous cyan covert feathers near the core -->
    <linearGradient id="pw-cyan-covert" x1="36" y1="28" x2="78" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8f6ff" />
      <stop offset="35%" stop-color="#8be7ff" />
      <stop offset="72%" stop-color="#4ab7ff" />
      <stop offset="100%" stop-color="#3b6fe3" />
    </linearGradient>

    <!-- Glowing aqua core inside the armor crescent -->
    <radialGradient id="pw-aqua-core" cx="72%" cy="44%" r="18%">
      <stop offset="0%" stop-color="#ecffff" />
      <stop offset="48%" stop-color="#9efbff" />
      <stop offset="82%" stop-color="#48d4ff" />
      <stop offset="100%" stop-color="#3898ff" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Silver Highlight Gradient -->
    <linearGradient id="pw-chrome-light" x1="51" y1="18" x2="94" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#eff5fa" />
      <stop offset="58%" stop-color="#b9c8d6" />
      <stop offset="84%" stop-color="#7c8d9e" />
      <stop offset="100%" stop-color="#4d5c6b" />
    </linearGradient>

    <!-- Metallic Silver Dark Bevel Gradient -->
    <linearGradient id="pw-chrome-dark" x1="54" y1="20" x2="96" y2="69" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8fa0b0" />
      <stop offset="38%" stop-color="#5c6c7d" />
      <stop offset="75%" stop-color="#384553" />
      <stop offset="100%" stop-color="#212a34" />
    </linearGradient>

    <!-- Metallic Silver Mid-tone Stem -->
    <linearGradient id="pw-chrome-stem" x1="76" y1="40" x2="94" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a8b8c8" />
      <stop offset="42%" stop-color="#e2eaf2" />
      <stop offset="78%" stop-color="#798999" />
      <stop offset="100%" stop-color="#3a4653" />
    </linearGradient>
  </defs>

  <!-- Soft ambient cyan glow behind the feather core -->
  <ellipse cx="64" cy="47" rx="22" ry="18" fill="url(#pw-aura)" />

  <!-- Seamless inner wing root backing behind covert feathers & silver mount -->
  <path d="M54 29 L82 40 L89 65 L73 58 L54 45 Z" fill="url(#pw-cyan-covert)" />

  <!-- ================= LAYER 1: OUTER LONG PRIMARY FEATHERS ================= -->
  <g stroke="#68bcff" stroke-width="0.55" stroke-linejoin="round">
    <!-- P16: Rightmost short tail feather (tip 91.2, 82.5) -->
    <path d="M89.2 64 C90.6 70.5 91.2 77 91.2 82.5 C88.8 76.8 86.8 71 85.2 65 Z" fill="url(#pw-ice-tail)" />

    <!-- P15: Third bottom tail feather (tip 83.8, 85.8) -->
    <path d="M88.5 63.5 C87.2 71.5 85.6 79.2 83.8 85.8 C83.5 77.8 83.6 70 84.5 63 Z" fill="url(#pw-ice-tail)" />

    <!-- P14: Second bottom tail feather (tip 74.5, 90.2) -->
    <path d="M86.2 62.5 C83 73 79 82.2 74.5 90.2 C76.5 80 79.2 70.5 81.8 61.5 Z" fill="url(#pw-ice-tail)" />

    <!-- P13: Longest dramatic bottom tail feather (tip 60.8, 97) -->
    <path d="M84 59.5 C77.8 73 69.8 86 60.8 97 C65 83.5 70.8 69.8 77 57.5 Z" fill="url(#pw-ice-tail)" />

    <!-- P12: Lower-right angled feather (tip 66.8, 78) -->
    <path d="M81 56.5 C76.8 64.2 71.8 71.5 66.8 78 C70 69.5 73.8 61.8 77.5 54.5 Z" fill="url(#pw-ice-tail)" />

    <!-- P8A: Small lower-left splinter feather (tip 40.2, 67) -->
    <path d="M64 49 C56 55.5 47.8 61.8 40.2 67 C45.8 59.5 53.5 52.5 61 47 Z" fill="url(#pw-ice-mid)" />

    <!-- P8: Long lower-left blade (tip 36.8, 71.8) -->
    <path d="M71 49 C60.5 58.2 48.8 66.2 36.8 71.8 C46 62 56.8 52.8 67 45.5 Z" fill="url(#pw-ice-outer)" />

    <!-- P9: Lower-mid blade (tip 50.5, 70.5) -->
    <path d="M74 50.5 C66.8 58.5 58.8 65.2 50.5 70.5 C57.2 61.5 64.5 53.2 71 47.5 Z" fill="url(#pw-ice-outer)" />

    <!-- P7: Horizontal-left lower sweeping blade (tip 22.5, 59.5) -->
    <path d="M68 46.5 C53.5 51.5 38 56.2 22.5 59.5 C36.5 62.2 52 59.2 68.5 51.5 Z" fill="url(#pw-ice-outer)" />

    <!-- P5: Mid-left long sweeping blade (tip 8.5, 40.5) -->
    <path d="M8.5 40.5 C26.5 45.2 46.5 47.2 67 46.5 L66 52.8 C44.5 54.2 24 49.5 8.5 40.5 Z" fill="url(#pw-ice-outer)" />

    <!-- P3: Wide upper-left sweeping primary blade (tip 1.5, 21) -->
    <path d="M1.5 21 C19.5 30.8 41.5 37.2 65 40 L63 47.5 C38 45.5 16.5 35.8 1.5 21 Z" fill="url(#pw-ice-outer)" />

    <!-- P4: Tucked upper-left blade (tip 16, 24) -->
    <path d="M16 24 C31.5 31.8 48.5 36.8 66 39.2 L64 44.5 C46.5 42.2 29.2 34.8 16 24 Z" fill="url(#pw-ice-mid)" />

    <!-- P1: Topmost grand sweeping primary blade (tip 2.5, 1.5) -->
    <path d="M2.5 1.5 C19.5 16.5 40.5 26.2 64 31 L60.5 38.2 C37 32.8 16.5 19.8 2.5 1.5 Z" fill="url(#pw-ice-outer)" />

    <!-- P2: Second top sweeping primary blade (tip 26, 10.5) -->
    <path d="M26 10.5 C39.5 20.5 53.5 26.5 67.5 30.2 L64 36.8 C49.5 32.5 36.5 23.5 26 10.5 Z" fill="url(#pw-ice-mid)" />
  </g>

  <!-- ================= LAYER 2: MID-WING OVERLAPPING CYAN FEATHERS ================= -->
  <g stroke="#56baff" stroke-width="0.52" stroke-linejoin="round">
    <!-- P6: Mid-left inner blade (tip 18.5, 36) -->
    <path d="M18.5 36 C33.5 41.2 49.5 44.2 66 45 L64.5 49.5 C47.5 48.8 31.5 44 18.5 36 Z" fill="url(#pw-ice-mid)" />

    <!-- C1: Upper covert blade (tip 35, 25.5) -->
    <path d="M35 25.5 C47 30.8 58.5 33.8 69.5 35.5 L67 39.8 C55.5 37.8 44.5 32.8 35 25.5 Z" fill="url(#pw-cyan-covert)" />

    <!-- C2: Second upper covert blade (tip 38.5, 32.5) -->
    <path d="M38.5 32.5 C50 36.8 60.5 39 70.5 40.2 L68 43.8 C57.5 42.5 47.2 38.5 38.5 32.5 Z" fill="url(#pw-cyan-covert)" />

    <!-- C3: Third covert blade (tip 43.5, 35.8) -->
    <path d="M43.5 35.8 C53.8 39.5 63 41.2 71.5 42 L69 45.2 C60 44.5 51 41.2 43.5 35.8 Z" fill="url(#pw-cyan-covert)" />

    <!-- C4: Mid horizontal covert blade (tip 45.8, 46.8) -->
    <path d="M45.8 46.8 C55 46 64 44.8 72 43.8 L70.5 48 C62 49 53.5 48.5 45.8 46.8 Z" fill="url(#pw-cyan-covert)" />

    <!-- C5: Lower-mid covert blade (tip 42.8, 52.5) -->
    <path d="M42.8 52.5 C53.5 51.2 63.5 49 72.5 46.5 L70.5 52.2 C61.2 55 51.8 55.2 42.8 52.5 Z" fill="url(#pw-cyan-covert)" />

    <!-- P10: Mid-lower cyan blade (tip 57.5, 67.2) -->
    <path d="M75.5 50 C70 56.8 63.8 62.5 57.5 67.2 C62 59.8 67 53.2 72 47.8 Z" fill="url(#pw-cyan-covert)" />

    <!-- P11: Lower-right cyan blade (tip 61.5, 72.5) -->
    <path d="M78.5 53 C73.2 60.5 67.5 66.8 61.5 72.5 C66.2 64.5 71.2 57 75.8 50.8 Z" fill="url(#pw-cyan-covert)" />
  </g>

  <!-- ================= LAYER 3: INNER LUMINOUS COVERT TIPS & AQUA CORE ================= -->
  <g stroke="#5ec8ff" stroke-width="0.45" stroke-linejoin="round" opacity="0.95">
    <path d="M61.5 40.5 C66 40 70.5 39.8 74.5 40 L72.5 43.5 C68.5 43 64.8 42 61.5 40.5 Z" fill="url(#pw-cyan-covert)" />
    <path d="M63.5 44.2 C68 43.2 72 42.5 75.8 42.2 L74 46.2 C70 46 66.5 45.5 63.5 44.2 Z" fill="url(#pw-cyan-covert)" />
    <path d="M65.5 49.5 C69.8 47.8 73.8 46.2 77.2 45.2 L75.5 49.8 C72 50.2 68.5 50.2 65.5 49.5 Z" fill="url(#pw-cyan-covert)" />
    <path d="M67.2 52.8 C71.5 50.5 75.5 48.5 78.8 47.2 L76.8 52.5 C73.5 53.2 70.2 53.2 67.2 52.8 Z" fill="url(#pw-cyan-covert)" />
    <path d="M70.2 55.2 C74.2 52.5 77.8 50.2 80.5 49 L78.8 54.5 C75.8 55.2 72.8 55.5 70.2 55.2 Z" fill="url(#pw-cyan-covert)" />
    <path d="M79 65.2 C81.2 61.2 83 57.8 84.5 55.5 L83.8 63.8 C82 64.5 80.5 65 79 65.2 Z" fill="url(#pw-cyan-covert)" />
    <path d="M81.8 66.8 C83.8 62.8 85.5 59.5 86.8 57.2 L86 65.5 C84.5 66.2 83.2 66.5 81.8 66.8 Z" fill="url(#pw-cyan-covert)" />
  </g>

  <!-- Intense glowing aqua crescent window underneath the silver claw -->
  <path d="M64 39.2 C71.5 38.8 79.5 41.2 83.5 46.5 C78.5 48.8 71.5 46.8 64 39.2 Z" fill="url(#pw-aqua-core)" />
  <path d="M67.5 40.5 C73.8 40.2 79.8 42.2 82.8 46 C78.5 47.4 72.8 45.5 67.5 40.5 Z" fill="#c4feff" opacity="0.96" />

  <!-- ================= LAYER 4: SCULPTED VALKYRIE SILVER ARMOR ================= -->
  <g>
    <!-- 4A. Dark metallic under-bevel & inner crescent wall -->
    <path d="M51.8 18.2 C60.5 24 72.5 29.5 81.5 34.5 C88 38.2 91.2 43.5 91.6 51.2 C89.6 48.6 88 47.8 86.6 48.6 C85.2 49.8 85.2 53.5 86.8 57.8 C88.5 61.8 91.5 64 95 65 C96.5 65.6 97.2 67.5 97.4 69.5 C95.2 67.6 92.8 66.4 90.5 66.2 C90.2 67.2 89.2 67.8 87.8 67.8 C88.2 66.2 88.2 64.5 87.2 63 C85.2 60.2 82.2 58.5 79.8 56.5 L82.2 54.5 C83 53.2 83 51.5 81.8 50.2 C76.5 48.2 71.2 46 66.8 44.2 C70.8 44.2 75 45.5 78.2 47.5 C79.8 46.8 81.5 46.2 83.5 46.5 C83.2 42.8 79.2 40.2 71.5 39.8 C65.8 39.5 61 36.8 56.5 32.8 C59.8 33.5 63.5 34.2 67 34.5 C61.2 31 55.8 25.5 51.8 18.2 Z" fill="url(#pw-chrome-dark)" />

    <!-- 4B. Main outer sweeping silver wing-arch (from top point 51.8,18.2 to right tip 91.6,51.2) -->
    <path d="M51.8 18.2 C60.5 24 72.5 29.5 81.5 34.5 C88 38.2 91.2 43.5 91.6 51.2 C89.8 48.8 88.2 47.8 86.8 48.2 C86.5 42.2 83 37.5 75.5 33.8 C67 29.5 58.5 25 51.8 18.2 Z" fill="url(#pw-chrome-light)" stroke="#475569" stroke-width="0.45" />

    <!-- 4C. First upper silver feather plate (51.8,18.2 -> 79.5,36.8) -->
    <path d="M51.8 18.2 C58.5 23.5 68.5 29 77.5 33.8 C79 34.8 80 36 80.2 37.2 C72.5 34.2 63.5 30 57.5 25.5 C55 23.2 53.2 20.8 51.8 18.2 Z" fill="url(#pw-chrome-light)" stroke="#475569" stroke-width="0.45" />

    <!-- 4D. Second overlapping silver feather plate (tip at 56.5, 32.8) -->
    <path d="M56.5 32.8 C63.5 34.2 71.5 35.8 78.8 38.2 C74.5 39 68.2 38.2 62.5 36.2 C59.8 35.2 57.8 34 56.5 32.8 Z" fill="url(#pw-chrome-light)" stroke="#475569" stroke-width="0.45" />

    <!-- 4E. Third overlapping silver covert plate (tip at 63.8, 37.5) -->
    <path d="M63.8 37.5 C69.5 37.8 75.2 38.8 80.2 40.8 C75.8 41.2 70.2 40.5 63.8 37.5 Z" fill="url(#pw-chrome-light)" stroke="#475569" stroke-width="0.42" />

    <!-- 4F. Lower silver guard claw & sculpted handle stem (from 66.8,44.2 down to 97.4,69.5) -->
    <path d="M66.8 44.2 C71.2 44.2 75.5 45.8 78.5 48 C80.5 47 82.5 46.2 84.5 46.5 C84.5 43.2 82.8 40 79.5 37.5 C83.8 39.8 86.2 43.5 86.5 47.8 C85 49.5 84.8 53.5 86.8 58 C88.5 61.8 91.5 64 95 65 C96.4 65.5 97.1 67.2 97.4 69.5 C95 67.4 92.6 66.2 90.2 66 C89.8 67 89 67.6 87.8 67.8 C88.3 66 88.2 64.2 87 62.8 C85 60 82 58.2 79.8 56.5 L82.2 54.5 C83.2 53.2 83.2 51.2 81.5 50 C76.5 48 71.2 46 66.8 44.2 Z" fill="url(#pw-chrome-stem)" stroke="#3e4c59" stroke-width="0.48" />

    <!-- 4G. Specular chrome white edge highlights -->
    <path d="M53.2 19.5 C62 25.5 73 30.5 81.5 35.5 C86.5 38.5 89.5 42.8 90.5 48.5" stroke="#ffffff" stroke-width="0.85" stroke-linecap="round" opacity="0.92" />
    <path d="M58.5 33.4 C65 34.8 72 36.2 77.8 38" stroke="#ffffff" stroke-width="0.65" stroke-linecap="round" opacity="0.88" />
    <path d="M69 44.8 C74 45.8 78.5 48 82.5 50.5" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.88" />
    <path d="M84.2 51.5 C83.8 55.8 86 60.2 90.5 63.5 C92.8 65 94.8 65.5 96.2 66.8" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
